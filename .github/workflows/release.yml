name: release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    # npm Trusted Publishing trusts this repo + workflow + environment; no npm token is stored
    environment: NPM_TOKEN
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens or updates the "Version packages" PR.
      # Without (that PR merged): builds and publishes the new versions.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
